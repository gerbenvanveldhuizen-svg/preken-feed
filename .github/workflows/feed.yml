name: Preken feed

on:
  schedule:
    - cron: "0 5,17 * * *"   # twee keer per dag
  workflow_dispatch:          # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - run: python icoon.py
      - run: python maak_feed.py
      - name: Feed opslaan
        run: |
          git config user.name "preken-bot"
          git config user.email "preken-bot@users.noreply.github.com"
          git add feed.xml afleveringen.json voorgangers.json icoon.png
          git diff --cached --quiet || git commit -m "Feed bijgewerkt"
          git push
